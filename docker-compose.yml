version: "3.9"

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dashboard-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ../backend-dashboard-python/backend-dashboard-python.backup
      dockerfile: Dockerfile
    container_name: dashboard-backend
    ports:
      - "8000:8000"
    env_file:
      - ../backend-dashboard-python/backend-dashboard-python.backup/.env
    environment:
      - DB_HOST=db
    depends_on:
      - db
    volumes:
      - ../backend-dashboard-python/backend-dashboard-python.backup:/app
    command: >
      sh -c "
      alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "
    restart: unless-stopped

  db:
    image: postgres:16
    container_name: dashboard-postgres
    restart: always
    environment:
      POSTGRES_DB: asmi_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
